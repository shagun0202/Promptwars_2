steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/smartelect:$COMMIT_SHA', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/smartelect:$COMMIT_SHA']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'smartelect'
      - '--image'
      - 'gcr.io/$PROJECT_ID/smartelect:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'VITE_GEMINI_API_KEY=${_VITE_GEMINI_API_KEY},VITE_MAPS_API_KEY=${_VITE_MAPS_API_KEY},VITE_YOUTUBE_API_KEY=${_VITE_YOUTUBE_API_KEY},VITE_TTS_API_KEY=${_VITE_TTS_API_KEY},VITE_TRANSLATE_API_KEY=${_VITE_TRANSLATE_API_KEY}'

substitutions:
  _VITE_GEMINI_API_KEY: ''
  _VITE_MAPS_API_KEY: ''
  _VITE_YOUTUBE_API_KEY: ''
  _VITE_TTS_API_KEY: ''
  _VITE_TRANSLATE_API_KEY: ''

images:
  - 'gcr.io/$PROJECT_ID/smartelect:$COMMIT_SHA'
